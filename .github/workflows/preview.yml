name: PR Preview - Docker Build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-preview:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # 1. BUILD FRONTEND IMAGE
      # ==========================================

      - name: Build and Push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: ghcr.io/shehbaaz11/pr-preview:${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # 2. BUILD BACKEND IMAGE
      # ==========================================

      - name: Build and Push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: ghcr.io/shehbaaz11/pr-preview-backend:${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # 3. NOTIFY BACKEND
      # ==========================================

      - name: Notify backend that images are ready
        run: |
          curl -X POST "${{ secrets.PREVIEW_BACKEND_URL }}/api/github/image-ready" \
            -H "Content-Type: application/json" \
            -d '{
              "prNumber": "${{ github.event.pull_request.number }}",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.event.pull_request.head.ref }}",
              "commitSha": "${{ github.event.pull_request.head.sha }}"
            }'